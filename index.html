<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halloween Spectral Camera</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: #00ff88;
      font-family: monospace;
      overflow: hidden;
    }

    #camera {
      position: fixed;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.55);
      padding: 12px;
      border: 1px solid #00ff88;
      z-index: 10;
    }

    button {
      margin-top: 10px;
      margin-right: 5px;
      padding: 10px;
      background: black;
      color: #00ff88;
      border: 1px solid #00ff88;
    }
  </style>
</head>

<body>

  <video id="camera" autoplay playsinline></video>

  <div id="hud">
    <div>CAMARA ESPECTRAL</div>

    <div id="yaw">Yaw real: --</div>
    <div id="relativeYaw">Yaw calibrado: --</div>

    <button id="startButton">INICIAR</button>
    <button id="calibrateButton">CALIBRAR</button>
  </div>

  <script>
    const video = document.getElementById("camera");

    let currentYaw = 0;
    let referenceYaw = 0;
    let calibrated = false;

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment"
        },
        audio: false
      });

      video.srcObject = stream;
    }

    function normalizeAngle(angle) {
      angle = angle % 360;

      if (angle > 180) angle -= 360;
      if (angle < -180) angle += 360;

      return angle;
    }

    function startOrientation() {

      window.addEventListener("deviceorientation", (event) => {

        currentYaw = event.alpha ?? 0;

        document.getElementById("yaw").textContent =
          "Yaw real: " + currentYaw.toFixed(1);

        if (calibrated) {

          let relative = normalizeAngle(
            currentYaw - referenceYaw
          );

          document.getElementById("relativeYaw").textContent =
            "Yaw calibrado: " + relative.toFixed(1);
        }
      });
    }

    document
      .getElementById("startButton")
      .addEventListener("click", async () => {

        await startCamera();

        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {

          const permission =
            await DeviceOrientationEvent.requestPermission();

          if (permission === "granted") {
            startOrientation();
          }

        } else {
          startOrientation();
        }
      });

    document
      .getElementById("calibrateButton")
      .addEventListener("click", () => {

        referenceYaw = currentYaw;
        calibrated = true;

        document.getElementById("relativeYaw").textContent =
          "Yaw calibrado: 0.0";
      });

  </script>

</body>
</html>

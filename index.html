<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halloween Spectral Camera</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: #00ff88;
      font-family: monospace;
      overflow: hidden;
    }

    #camera {
      position: fixed;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.55);
      padding: 12px;
      border: 1px solid #00ff88;
      z-index: 10;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      background: black;
      color: #00ff88;
      border: 1px solid #00ff88;
    }
  </style>
</head>

<body>

  <video id="camera" autoplay playsinline></video>

  <div id="hud">
    <div>CAMARA ESPECTRAL</div>
    <div id="alpha">Yaw: --</div>
    <div id="beta">Pitch: --</div>
    <div id="gamma">Roll: --</div>

    <button id="startButton">INICIAR</button>
  </div>

  <script>
    const video = document.getElementById("camera");

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment"
        },
        audio: false
      });

      video.srcObject = stream;
    }

    function startOrientation() {

      window.addEventListener("deviceorientation", (event) => {

        const alpha = event.alpha ?? 0;
        const beta = event.beta ?? 0;
        const gamma = event.gamma ?? 0;

        document.getElementById("alpha").textContent =
          "Yaw: " + alpha.toFixed(1);

        document.getElementById("beta").textContent =
          "Pitch: " + beta.toFixed(1);

        document.getElementById("gamma").textContent =
          "Roll: " + gamma.toFixed(1);
      });
    }

    document
      .getElementById("startButton")
      .addEventListener("click", async () => {

        await startCamera();

        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {

          const permission =
            await DeviceOrientationEvent.requestPermission();

          if (permission === "granted") {
            startOrientation();
          }

        } else {
          startOrientation();
        }

      });
  </script>

</body>
</html>
